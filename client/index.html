<!doctype html>
<html lang="pt">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--seo-start-->
    <title>Harmónico Augusto — Engenheiro e Cientista da Computação</title>
    <meta name="description" content="Portefólio de Harmónico Augusto, engenheiro e cientista da computação em Maputo, Moçambique: cibersegurança, redes, infra-estruturas de TI e desenvolvimento de software." />
    <!--seo-end-->
    <meta name="theme-color" content="#d9dadd" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
        if (location.pathname.indexOf("/admin") === 0) document.documentElement.classList.add("admin-mode");
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script src="/api/platform/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>

  </body>

</html>
